name: Wallpapers_8k1 CI/CD Pipeline

on:
  push:
    branches: [ main, master, release/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Pytest & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: w8k1_user
          POSTGRES_PASSWORD: w8k1_secure_password
          POSTGRES_DB: wallpapers_8k1_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies for Pillow & PG
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libjpeg-dev zlib1g-dev libwebp-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest-cov

      - name: Run Database Migrations (Alembic)
        env:
          DATABASE_URL: postgresql+asyncpg://w8k1_user:w8k1_secure_password@localhost:5432/wallpapers_8k1_db
          SECRET_KEY: test_secret_key_32_bytes_long_random_string_123
          JWT_SECRET: test_jwt_key_32_bytes_long_random_string_456
          APP_ENV: testing
        run: |
          cd backend
          python -m alembic upgrade head

      - name: Execute Backend Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://w8k1_user:w8k1_secure_password@localhost:5432/wallpapers_8k1_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_32_bytes_long_random_string_123
          JWT_SECRET: test_jwt_key_32_bytes_long_random_string_456
          APP_ENV: testing
        run: |
          cd backend
          pytest --maxfail=1 --disable-warnings -v

  admin-build:
    name: Admin Web Panel Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install Dependencies
        working-directory: ./admin
        run: npm ci

      - name: TypeScript Check & Vite Production Build
        working-directory: ./admin
        run: npm run build

  mobile-check:
    name: Flutter Mobile Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.x
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: ./mobile
        run: flutter analyze --no-fatal-infos

  docker-build:
    name: Production Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, admin-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: wallpapers8k1-backend:latest

      - name: Build Admin Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          file: ./admin/Dockerfile
          push: false
          tags: wallpapers8k1-admin:latest
