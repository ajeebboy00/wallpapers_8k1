name: Build Test APK (Wi-Fi Local Dev)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build_test_apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Test Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses & Precache
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
          flutter precache --android
          yes | flutter doctor --android-licenses || true

      - name: Verify Environment
        run: |
          flutter --version
          java -version

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build Android Release APK for Wi-Fi Testing
        working-directory: ./mobile
        run: |
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation -t "$PWD/lib/main.dart" --dart-define=APP_ENV=development --dart-define=API_BASE_URL="http://10.72.10.121:8000/api/v1" -v > ../build.log 2>&1 || {
            echo "Checking for generated .apk files across workspace..."
            find . -name "*.apk" -ls || true
            if ls android/build/app/outputs/flutter-apk/*.apk 1> /dev/null 2>&1; then
              mkdir -p build/app/outputs/flutter-apk
              cp -v android/build/app/outputs/flutter-apk/*.apk build/app/outputs/flutter-apk/
              echo "Successfully copied APK to mobile/build/app/outputs/flutter-apk/"
            elif ls build/app/outputs/flutter-apk/*.apk 1> /dev/null 2>&1; then
              echo "APK found in mobile/build/app/outputs/flutter-apk/"
            else
              cat ../build.log | tail -n 150
              exit 1
            fi
          }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-apk-failure-log
          path: build.log

      - name: Upload Test APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wallpapers8k1-Test-APK
          path: |
            mobile/build/app/outputs/flutter-apk/*.apk
            mobile/android/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
