name: Build Play Store AAB

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build_aab.yml'

jobs:
  build-aab:
    name: Build Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses & Precache
        run: |
          flutter precache --android
          yes | flutter doctor --android-licenses || true

      - name: Verify Environment
        run: |
          flutter --version
          java -version

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Static Code Analysis (Advisory)
        working-directory: ./mobile
        run: flutter analyze --no-fatal-infos || true

      - name: Build Android App Bundle (.aab)
        working-directory: ./mobile
        run: |
          set -o pipefail
          flutter build appbundle --release --no-tree-shake-icons 2>&1 | tee ../build.log

      - name: Generate Step Summary
        if: always()
        run: |
          echo "### Build Execution Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f build.log ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 60 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build.log

      - name: Upload Play Store AAB Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Wallpapers8k1-Release-AAB
          path: mobile/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
