name: wallpapers_8k1
description: "Wallpapers_8k1 - Production Grade Full-Stack 8K Wallpaper Discovery Platform"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Network & API
  dio: ^5.4.1
  pretty_dio_logger: ^1.3.1

  # Local Persistence & Secure Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Image Caching & Rendering
  cached_network_image: ^3.3.1
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0

  # System & Device Integrations
  permission_handler: ^11.3.0
  path_provider: ^2.1.2
  share_plus: ^7.2.2
  url_launcher: ^6.2.5

  # Navigation & UI Polish
  go_router: ^13.2.0
  google_fonts: ^6.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  bloc_test: ^9.1.7
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
